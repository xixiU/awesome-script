<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>智慧法庭部署上传系统</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			background-color: #f4f7f9;
			padding: 20px;
		}

		.upload-container {
			background: #ffffff;
			padding: 30px 40px;
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
			width: 100%;
			max-width: 600px;
			text-align: center;
		}

		h1 {
			color: #333;
			margin-bottom: 25px;
			font-weight: 600;
		}

		/* 部署时间显示区域样式 */
		.deployment-info {
			background: #f8f9fa;
			border: 1px solid #e9ecef;
			border-radius: 8px;
			padding: 15px;
			margin-bottom: 25px;
			text-align: left;
		}

		.deployment-info h3 {
			color: #495057;
			margin: 0 0 10px 0;
			font-size: 16px;
			font-weight: 600;
		}

		.deployment-time {
			color: #007bff;
			font-weight: 500;
			font-size: 14px;
		}

		.deployment-loading {
			color: #6c757d;
			font-style: italic;
		}

		.deployment-error {
			color: #dc3545;
			font-size: 14px;
		}

		#uploadForm {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		/* 文件类型选择 */
		.file-type-selector {
			display: flex;
			gap: 15px;
			justify-content: center;
			margin-bottom: 10px;
		}

		.file-type-btn {
			flex: 1;
			padding: 12px 20px;
			border: 2px solid #d0d7e0;
			background: white;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.2s;
			font-size: 16px;
			font-weight: 500;
		}

		.file-type-btn:hover {
			border-color: #007bff;
			background-color: #f8f9fa;
		}

		.file-type-btn.active {
			border-color: #007bff;
			background-color: #007bff;
			color: white;
		}

		/* 配置文件排除选项 */
		.config-option {
			background: #fff3cd;
			border: 1px solid #ffc107;
			border-radius: 8px;
			padding: 12px;
			margin-bottom: 15px;
			display: none;
		}

		.config-option.show {
			display: block;
		}

		.config-option label {
			display: flex;
			align-items: center;
			gap: 10px;
			cursor: pointer;
			justify-content: center;
		}

		.config-option input[type="checkbox"] {
			width: 18px;
			height: 18px;
			cursor: pointer;
		}

		.file-input-wrapper {
			border: 2px dashed #d0d7e0;
			padding: 25px;
			border-radius: 8px;
			cursor: pointer;
			transition: background-color 0.2s, border-color 0.2s;
		}

		.file-input-wrapper:hover {
			background-color: #f8f9fa;
			border-color: #007bff;
		}

		#fileInput {
			display: none;
		}

		#file-name-display {
			color: #555;
			margin-top: 10px;
			font-style: italic;
		}

		.supported-files {
			font-size: 12px;
			color: #6c757d;
			margin-top: 8px;
		}

		#uploadButton {
			background-color: #007bff;
			color: white;
			border: none;
			padding: 12px 15px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
			font-weight: 500;
			transition: background-color 0.2s, opacity 0.2s;
			opacity: 0.6;
			pointer-events: none;
		}

		#uploadButton.enabled {
			opacity: 1;
			pointer-events: auto;
		}

		#uploadButton:hover.enabled {
			background-color: #0056b3;
		}

		#statusMessage {
			margin-top: 20px;
			font-size: 1em;
			font-weight: 500;
			min-height: 20px;
		}

		.status-success {
			color: #28a745;
		}

		.status-error {
			color: #dc3545;
		}

		/* --- Circular Progress Bar Styles --- */
		.progress-ring {
			position: relative;
			width: 120px;
			height: 120px;
			margin: 20px auto;
		}

		.progress-ring__svg {
			transform: rotate(-90deg);
		}

		.progress-ring__track,
		.progress-ring__circle {
			fill: transparent;
			stroke-width: 10;
		}

		.progress-ring__track {
			stroke: #e6e6e6;
		}

		.progress-ring__circle {
			stroke: #007bff;
			stroke-linecap: round;
			transition: stroke-dashoffset 0.35s;
		}

		.progress-ring__text {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.5em;
			font-weight: 600;
			color: #0056b3;
		}

		.hidden {
			display: none;
		}
	</style>
</head>

<body>

	<div class="upload-container">
		<h1>智慧法庭研发184 部署上传系统</h1>

		<!-- 部署时间信息显示区域 -->
		<div class="deployment-info">
			<h3>智慧法庭</h3>
			<div id="deploymentTime" class="deployment-loading">正在获取部署时间...</div>
		</div>

		<div id="form-container">
			<form id="uploadForm">
				<!-- 文件类型选择 -->
				<div class="file-type-selector">
					<button type="button" class="file-type-btn active" data-type="jar">后端JAR包</button>
					<button type="button" class="file-type-btn" data-type="zip">前端ZIP包</button>
				</div>

				<!-- 配置文件排除选项（仅ZIP时显示） -->
				<div class="config-option" id="configOption">
					<label>
						<input type="checkbox" id="excludeConfig" checked>
						<span>部署时排除配置文件（推荐）</span>
					</label>
				</div>

				<label for="fileInput" class="file-input-wrapper">
					<div id="upload-hint">
						点击此处选择JAR包
					</div>
					<div id="file-name-display">未选择任何文件</div>
					<div class="supported-files" id="supported-files">
						当前支持: ts-service、aicourt-monitor、aicourt-video、aicourt-assistant-service、iflytek-admin
					</div>
				</label>
				<input type="file" id="fileInput" accept=".jar" required>
				<button type="submit" id="uploadButton">上传文件</button>
			</form>
		</div>

		<div id="progress-container" class="hidden">
			<div class="progress-ring">
				<svg class="progress-ring__svg" width="120" height="120">
					<circle class="progress-ring__track" r="50" cx="60" cy="60" />
					<circle class="progress-ring__circle" id="progress-ring-circle" r="50" cx="60" cy="60" />
				</svg>
				<div class="progress-ring__text" id="progress-text">0%</div>
			</div>
		</div>

		<div id="statusMessage"></div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			// DOM Elements
			const uploadForm = document.getElementById('uploadForm');
			const fileInput = document.getElementById('fileInput');
			const uploadButton = document.getElementById('uploadButton');
			const statusMessage = document.getElementById('statusMessage');
			const fileNameDisplay = document.getElementById('file-name-display');
			const formContainer = document.getElementById('form-container');
			const progressContainer = document.getElementById('progress-container');
			const progressCircle = document.getElementById('progress-ring-circle');
			const progressText = document.getElementById('progress-text');
			const deploymentTime = document.getElementById('deploymentTime');
			const fileTypeBtns = document.querySelectorAll('.file-type-btn');
			const configOption = document.getElementById('configOption');
			const excludeConfigCheckbox = document.getElementById('excludeConfig');
			const uploadHint = document.getElementById('upload-hint');
			const supportedFiles = document.getElementById('supported-files');

			// Config
			const N8N_WEBHOOK_BASE_URL = 'http://172.31.160.184:5678/webhook/uploadJar';
			const DEPLOYMENT_STATUS_URL = 'http://172.31.160.184:5678/webhook/zftdDetect';

			let currentFileType = 'jar';

			const radius = progressCircle.r.baseVal.value;
			const circumference = 2 * Math.PI * radius;
			progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
			progressCircle.style.strokeDashoffset = circumference;

			// 文件类型配置
			const fileTypeConfig = {
				jar: {
					accept: '.jar',
					hint: '点击此处选择JAR包',
					supported: '当前支持: ts-service、aicourt-monitor、aicourt-video、aicourt-assistant-service、iflytek-admin'
				},
				zip: {
					accept: '.zip',
					hint: '点击此处选择ZIP包',
					supported: '当前支持: tsManagementClientWeb、recordBack、hlwts-web等内网前端项目'
				}
			};

			// 文件类型切换
			fileTypeBtns.forEach(btn => {
				btn.addEventListener('click', () => {
					fileTypeBtns.forEach(b => b.classList.remove('active'));
					btn.classList.add('active');
					currentFileType = btn.dataset.type;

					// 更新UI
					const config = fileTypeConfig[currentFileType];
					fileInput.accept = config.accept;
					uploadHint.textContent = config.hint;
					supportedFiles.textContent = config.supported;

					// 显示/隐藏配置文件排除选项
					if (currentFileType === 'zip') {
						configOption.classList.add('show');
					} else {
						configOption.classList.remove('show');
					}

					// 重置文件选择
					fileInput.value = '';
					fileNameDisplay.textContent = '未选择任何文件';
					uploadButton.classList.remove('enabled');
				});
			});

			// 获取部署时间函数
			async function fetchDeploymentTime() {
				try {
					const response = await fetch(DEPLOYMENT_STATUS_URL, {
						method: 'GET',
					});

					if (!response.ok) {
						throw new Error(`HTTP error! status: ${response.status}`);
					}

					const deploymentTimeText = await response.text();

					if (deploymentTimeText && deploymentTimeText.trim()) {
						deploymentTime.textContent = `上次部署时间: ${deploymentTimeText.trim()}`;
						deploymentTime.className = 'deployment-time';
					} else {
						deploymentTime.textContent = '暂无部署时间信息';
						deploymentTime.className = 'deployment-time';
					}
				} catch (error) {
					console.error('获取部署时间失败:', error);
					deploymentTime.textContent = '获取部署时间失败，请检查网络连接';
					deploymentTime.className = 'deployment-error';
				}
			}

			// 自动刷新部署时间的定时器
			let deploymentRefreshTimer = null;

			function startAutoRefresh() {
				fetchDeploymentTime();
				deploymentRefreshTimer = setInterval(() => {
					fetchDeploymentTime();
				}, 10000);
			}

			function stopAutoRefresh() {
				if (deploymentRefreshTimer) {
					clearInterval(deploymentRefreshTimer);
					deploymentRefreshTimer = null;
				}
			}

			startAutoRefresh();

			function setProgress(percent) {
				const offset = circumference - (percent / 100) * circumference;
				progressCircle.style.strokeDashoffset = offset;
				progressText.textContent = `${percent}%`;
			}

			fileInput.addEventListener('change', () => {
				if (fileInput.files.length > 0) {
					const fileName = fileInput.files[0].name;
					const fileExt = fileName.split('.').pop().toLowerCase();

					// 验证文件类型
					if ((currentFileType === 'jar' && fileExt !== 'jar') ||
						(currentFileType === 'zip' && fileExt !== 'zip')) {
						showStatus(`请选择正确的${currentFileType.toUpperCase()}文件！`, 'error');
						fileInput.value = '';
						fileNameDisplay.textContent = '未选择任何文件';
						uploadButton.classList.remove('enabled');
						return;
					}

					fileNameDisplay.textContent = `已选择: ${fileName}`;
					uploadButton.classList.add('enabled');
				} else {
					fileNameDisplay.textContent = '未选择任何文件';
					uploadButton.classList.remove('enabled');
				}
			});

			uploadForm.addEventListener('submit', (event) => {
				event.preventDefault();
				const file = fileInput.files[0];
				if (!file) {
					showStatus('请先选择一个文件！', 'error');
					return;
				}

				// UI Orchestration
				formContainer.classList.add('hidden');
				progressContainer.classList.remove('hidden');
				statusMessage.textContent = '正在上传...';
				statusMessage.className = '';
				setProgress(0);

				// Use XMLHttpRequest for Progress Events
				const xhr = new XMLHttpRequest();
				const fileName = file.name;
				const excludeConfig = currentFileType === 'zip' ? excludeConfigCheckbox.checked : true;
				const fullUrl = `${N8N_WEBHOOK_BASE_URL}?fileName=${encodeURIComponent(fileName)}&excludeConfig=${excludeConfig}`;

				// Upload progress
				xhr.upload.addEventListener('progress', (e) => {
					if (e.lengthComputable) {
						const percentComplete = Math.round((e.loaded / e.total) * 100);
						setProgress(percentComplete);
					}
				});

				// Upload finished
				xhr.addEventListener('load', () => {
					setProgress(100);
					if (xhr.status >= 200 && xhr.status < 300) {
						setTimeout(() => {
							progressContainer.classList.add('hidden');
							formContainer.classList.remove('hidden');
							uploadForm.reset();
							fileNameDisplay.textContent = '未选择任何文件';
							uploadButton.classList.remove('enabled');

							const deployType = currentFileType === 'jar' ? '后端服务' : '前端页面';
							showStatus(`${deployType}已成功上传，请等待部署完成。`, 'success');
						}, 500);
					} else {
						handleUploadError(`上传失败: 服务器返回错误 ${xhr.status}. ${xhr.responseText}`);
					}
				});

				// Network or other errors
				xhr.addEventListener('error', () => {
					handleUploadError('上传出错: 请检查网络连接或n8n CORS配置。');
				});

				xhr.open('POST', fullUrl, true);
				xhr.setRequestHeader('Content-Type', 'application/octet-stream');
				xhr.send(file);
			});

			function handleUploadError(message) {
				progressContainer.classList.add('hidden');
				formContainer.classList.remove('hidden');
				showStatus(message, 'error');
			}

			function showStatus(message, type) {
				statusMessage.textContent = message;
				statusMessage.className = '';
				if (type === 'success') {
					statusMessage.classList.add('status-success');
				} else if (type === 'error') {
					statusMessage.classList.add('status-error');
				}
			}
		});
	</script>

</body>

</html>
